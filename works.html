<figure style="margin: 0; padding-bottom: 20px;">

  <figcaption style="margin-top: 8px; font-style: regular; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">"Academic Weapon," 2026. Academic Weapon is a meme mashup of Kali Uchis, which is an iconic meme made popular by Gen Z. This mashup shows her in festival attire or also described as rave culture as she's doing work on Canvas. By using Adobe Photoshop, I was able to reuse this meme and change its context by adding popular rave accessories. To be able to appropriate and repurpose a meme is important as it goes beyond something seen as funny, but as a way to share new information. </figcaption>
</div>

 <div>
<figure style="margin: 0; padding-bottom: 20px;">
    <video controls style="width: 100%; height: auto; display: block;">
      <source src="moretime.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <figcaption style="margin-top: 8px; font-style: regular; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">"moretime," 2026. A time-based mashup that appropriates, <a href="https://youtu.be/1mLNza10dKs?si=OpaoSUk37IiQSwaK">Kelela - outta time (feat. A. K. Paul) (Official Video).</a> This project is a bit more personal, as it gives you a piece of which genres and artists I often listen to. I've grown up being able to create my own video edits using mobile apps such as Videostar, Cute Cut, and Alight Motion. Through this project I was able to work with Premiere and Colab for the first time where I was able to experiment with not just editing, but working with frames through repetition and manipulation. </figcaption>
  </div>

<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; width: 100%; margin-bottom: 40px;">

  < Monchilla >
  <figure style="margin: 0; padding-bottom: 20px; flex: 1; max-width: 45%; min-width: 280px;">
    <div style="width: 100%; overflow: hidden;">
      <img src="monchilla.png" alt="Art 3" style="width: 110%; height: auto; display: block;">
    </div>
    <figcaption style="margin-top: 8px; font-weight: normal; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">
      <a href="https://kaisothkey.github.io/" style="color: inherit;">"Monchilla,"</a> 2026. A combination of two of my favorite things; producer J Dilla and the cutest monkey, Monchhichi. My first ever html webpages coded with the help of W3Schools. This was purely experimental as my pages weren't necessarily connected to one another. It's gotten me up to this point as I'm now able to code my own portfolio a bit easier after some repetition.
    </figcaption>
  </figure>

  <figure style="margin: 0; padding-bottom: 20px; flex: 1; max-width: 45%; min-width: 280px;">
    <div style="width: 100%; overflow: hidden;">
      <img src="mute.png" alt="Art 4" style="width: 100%; height: auto; display: block;">
    </div>
    <figcaption style="margin-top: 8px; font-weight: normal; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">
      "Mute," 2026. Glitch art, but with intent. Originally the image I used was a photo of ex-Lakers player, #28 Rui Hachimura. The image was converted into raw data which then was put into Audacity where I tweaked its waveform and added random effects then lastly ran back into Photoshop for its final result. Before this project I never thought about how glitch art is a mix between manipulation and control.
    </figcaption>
  </figure>
